<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Calmotion 快捷指令短视频工作流程</title>
  <desc id="desc">从参考影片、标题、片头、录屏和音乐到预览质检与正式成片的流程图</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10131a"/><stop offset="1" stop-color="#202733"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff4d4f"/></marker>
  </defs>
  <rect width="1400" height="520" rx="30" fill="url(#bg)"/>
  <text x="70" y="76" fill="#ffffff" font-size="36" font-weight="700" font-family="Arial, 'Noto Sans SC', sans-serif">Calmotion 快捷指令短视频工作流程</text>
  <text x="70" y="116" fill="#9fa8b8" font-size="21" font-family="Arial, 'Noto Sans SC', sans-serif">6 秒 · 9:16 · 标题 / 片头 / 音乐轮换 · 预览后再输出</text>
  <g filter="url(#shadow)" font-family="Arial, 'Noto Sans SC', sans-serif">
    <rect x="70" y="175" width="210" height="220" rx="22" fill="#262f3d" stroke="#445064"/><circle cx="175" cy="225" r="28" fill="#ff4d4f"/><text x="175" y="233" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">1</text><text x="175" y="292" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">分析参考影片</text><text x="175" y="334" text-anchor="middle" fill="#b9c0cc" font-size="19">节奏 · 标题位置</text><text x="175" y="365" text-anchor="middle" fill="#b9c0cc" font-size="19">转场 · 结果画面</text>
    <rect x="330" y="175" width="210" height="220" rx="22" fill="#262f3d" stroke="#445064"/><circle cx="435" cy="225" r="28" fill="#ff4d4f"/><text x="435" y="233" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">2</text><text x="435" y="292" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">轮换选择</text><text x="435" y="334" text-anchor="middle" fill="#b9c0cc" font-size="19">三批标题</text><text x="435" y="365" text-anchor="middle" fill="#b9c0cc" font-size="19">片头 + 音乐</text>
    <rect x="590" y="175" width="240" height="220" rx="22" fill="#ff4d4f" stroke="#ff7678"/><circle cx="710" cy="225" r="28" fill="#ffffff"/><text x="710" y="233" text-anchor="middle" fill="#ff4d4f" font-size="24" font-weight="700">3</text><text x="710" y="292" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">组合 6 秒正片</text><text x="710" y="334" text-anchor="middle" fill="#fff" font-size="20">2 秒快捷指令</text><text x="710" y="365" text-anchor="middle" fill="#fff" font-size="20">+ 4 秒拍摄录屏</text>
    <rect x="880" y="175" width="210" height="220" rx="22" fill="#262f3d" stroke="#445064"/><circle cx="985" cy="225" r="28" fill="#ff4d4f"/><text x="985" y="233" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">4</text><text x="985" y="292" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">预览与质检</text><text x="985" y="334" text-anchor="middle" fill="#b9c0cc" font-size="19">标题不挡图标</text><text x="985" y="365" text-anchor="middle" fill="#b9c0cc" font-size="19">2 秒后完全消失</text>
    <rect x="1140" y="175" width="190" height="220" rx="22" fill="#262f3d" stroke="#445064"/><circle cx="1235" cy="225" r="28" fill="#45c486"/><text x="1235" y="233" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">5</text><text x="1235" y="292" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">输出成品</text><text x="1235" y="334" text-anchor="middle" fill="#b9c0cc" font-size="19">1080 × 1920</text><text x="1235" y="365" text-anchor="middle" fill="#b9c0cc" font-size="19">抖音 / 小红书</text>
  </g>
  <g stroke="#ff4d4f" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M 282 285 L 322 285"/><path d="M 542 285 L 582 285"/><path d="M 832 285 L 872 285"/><path d="M 1092 285 L 1132 285"/></g>
  <text x="70" y="460" fill="#7f8a9b" font-size="18" font-family="Arial, 'Noto Sans SC', sans-serif">工作文件进入 成品/_edit；只有通过检查的 MP4 才进入 成品根目录。</text>
</svg>
